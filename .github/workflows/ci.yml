name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deep_data_research_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deep_data_research_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_MIGRATION_URI: postgresql://postgres:postgres@127.0.0.1:5432/deep_data_research_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --frozen
      - name: Verify Alembic model parity
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
