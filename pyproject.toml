[project]
name = "deep-data-research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "QF", email = "2622874252@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "argon2-cffi>=25.1.0",
    "deepagents==0.6.12",
    "deepagents-opensandbox==1.0.2",
    "duckdb>=1.5.5",
    "fastapi>=0.140.5",
    "httpx[socks]>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.3,<2",
    "langchain-openai>=1.4,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "langgraph-store-mongodb>=0.3,<0.4",
    "langsmith>=0.10,<0.11",
    "markdownify>=1.2.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "opensandbox==0.1.15",
    "pandas>=3.0.5",
    "playwright>=1.61.0",
    "polars>=1.43.1",
    "protego>=0.6.2",
    "pyarrow>=25.0.0",
    "pymongo>=4.17,<5",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2,<3",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.20,<1",
    "selectolax>=0.4.11",
    "sqlalchemy>=2.0.46,<3",
    "tabulate>=0.10.0",
    "tavily-python>=0.7.26",
    "tenacity>=9.1.4",
    "tldextract>=5.3.1",
    "langchain-mcp-adapters>=0.3.1",
    # langchain-mcp-adapters 0.3.1 still uses the MCP 1.x SDK API.
    "mcp>=1.24,<2",
]

[project.scripts]
deep-data-research-agent = "deep_data_research_agent:main"
reset-agent-memory = "deep_data_research_agent.reset_memory:main"
setup-agent-postgres = "deep_data_research_agent.postgres_setup:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "langgraph-cli[inmem]>=0.4,<0.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires explicitly configured external services",
]
