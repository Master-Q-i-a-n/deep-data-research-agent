name: deep-data-research-agent

services:
  ddra-redis:
    build:
      context: ./infra/redis
      dockerfile: Dockerfile
    image: deep-data-research-agent/redis:7.4
    container_name: ddra-redis
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/ddra-redis-entrypoint.sh"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - ddra-redis-data:/data
    secrets:
      - redis_password
    tmpfs:
      - /run/redis:size=1m,mode=0700
    healthcheck:
      test:
        - CMD-SHELL
        - 'password="$$(cat /run/secrets/redis_password)"; REDISCLI_AUTH="$$password" redis-cli --user ddra --no-auth-warning ping | grep -qx PONG && REDISCLI_AUTH="$$password" redis-cli --user ddra-celery --no-auth-warning -n 1 ping | grep -qx PONG'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true

secrets:
  redis_password:
    file: ./.secrets/redis_password

volumes:
  ddra-redis-data:
    name: ddra-redis-data
